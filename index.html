<!DOCTYPE html>
<html>
<head>
  <title>Bella Pelle Beauty</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{
      font-family:Arial;
      background:#F7DDE6;
      padding:30px;
      color:#4A3A3A;
    }
    .card{
      background:white;
      padding:20px;
      border-radius:20px;
      margin-bottom:20px;
    }
    h1{
      color:#C9A45C;
    }
    button{
      background:#C9A45C;
      color:white;
      border:none;
      padding:12px;
      width:100%;
      border-radius:12px;
      margin-top:10px;
      font-size:16px;
    }
    input{
      width:100%;
      padding:12px;
      border-radius:10px;
      border:1px solid #ddd;
      margin-top:10px;
    }
  </style>
</head>
<body>

<h1>Bella Pelle Beauty</h1>

<div class="card">
  <h2>Novo Agendamento</h2>

  <input placeholder="Nome da cliente">
  <input placeholder="Procedimento">
  <input type="date">
  <input type="time">

  <button>Salvar Agendamento</button>
</div>

<div class="card">
  <h2>Financeiro</h2>

  <p>Entrou hoje: R$0,00</p>
  <p>Saiu hoje: R$0,00</p>
  <p>Saldo: R$0,00</p>
</div>

</body>
</html>
